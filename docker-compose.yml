version: '3'

services:
  postgres:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pokemon
      POSTGRES_USER: postgres
    networks:
      - mynetwork
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d/

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    networks:
      - mynetwork
    ports:
      - "5050:80"

networks:
  mynetwork:
    driver: bridge
