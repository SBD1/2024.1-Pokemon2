site_name: Pokemon
theme:
  features:
    - navigation.sections
    - navigation.path
    - search.suggest
    - search.highlight
  name: material
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/link
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/toggle-switch-off
        name: Switch to system preference
  language: pt-BR
  extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/SBD1/2024.1-Pokemon2


nav:
  - Home: geral/index.md
  - Artefatos :
    - DER: 
      - V1: der_dicionario/der_v1.md
      - V2: der_dicionario/der_v2.md
      - V3: der_dicionario/der_v3.md
      - V4: der_dicionario/der_v4.md 
    - Dicionário de Dados:
      - V1: der_dicionario/dicionario_de_dados_v1.md
      - V2: der_dicionario/dicionario_de_dados_v2.md
      - V3: der_dicionario/dicionario_de_dados_v3.md
      - V4: der_dicionario/dicionario_de_dados_v4.md
      - V5: der_dicionario/dicionario_de_dados_v5.md
    - Modelos Relacional: 
      - V1: modelo_logico/modelo_logico.md
      - V2: modelo_logico/modelo_logico_v2.md
      - V3: modelo_logico/modelo_logico_v3.md

  - Geral:
    - Ata de Reuniões: geral/ata_de_reunioes.md
    - Apresentações: geral/apresentacoes.md
  - Jogo:
    - Jogo: game/game.md


extra_javascript:
  - js/custom.js

extra_css:
  - css/custom.css

